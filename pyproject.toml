[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovascularsim"
version = "0.1.0"
description = "Physiological simulation of neurovascular coupling, microvascular blood flow and the fMRI signal."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alejandro Suarez" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.23"]
dev = ["pytest>=7", "httpx>=0.25", "fastapi>=0.110", "uvicorn>=0.23"]

[project.scripts]
nvs = "neurovascularsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
