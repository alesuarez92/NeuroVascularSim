[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurovascularsim"
version = "0.1.0"
description = "Physiological simulation of neurovascular coupling, microvascular blood flow and the fMRI signal."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alejandro Suarez" }]
license = { file = "LICENSE.txt" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
